<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="style.js" defer></script>
    <title>Rock, Paper and Scissors</title>
</head>
<body>
    
    <div class="main-container">
        
        <div class="score">
            <div><h1>YOU</h1>
                <p class="human-score">0</p>
                <dialog class="pop-up"></dialog>
            </div>
            <div>
                <h2>COMPUTER</h2>
                <p class="computer-score">0</p></div> 
        </div>
        <div class="results"></div>
    <div class="button-container">
    <button class="rock-button game-button red">Rock</button>

    <button class="paper-button game-button orange">Paper</button>
    
    <button class="scissors-button game-button green">Scissors</button>
    
    <button class="reset-button game-button">Reset</button>
</div>

</div>
</body>
</html>
